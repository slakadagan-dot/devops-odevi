<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 242, 254, 0.08), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .dashboard-container {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            width: 100%;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent-secondary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 80px rgba(0, 242, 254, 0.1);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-title {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            width: 0%;
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        .uptime-value {
            font-size: 2.2rem;
            background: linear-gradient(to right, #fff, #a8c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-break: break-all;
            text-align: center;
        }

        .live-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse-anim 1.5s infinite;
        }

        @keyframes pulse-anim {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="live-indicator">
        <div class="pulse"></div>
        LIVE
    </div>

    <div class="header">
        <h1>System Monitor</h1>
        <p>Real-time performance metrics</p>
    </div>

    <div class="dashboard-container">
        <!-- CPU Card -->
        <div class="card">
            <div class="card-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
            </div>
            <div class="card-title">CPU Load</div>
            <div class="card-value" id="cpu-val">0<span style="font-size: 1.5rem; color: var(--text-muted)">%</span></div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="cpu-bar"></div>
            </div>
        </div>

        <!-- RAM Card -->
        <div class="card">
            <div class="card-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="2" ry="2"></rect><line x1="6" y1="7" x2="6" y2="17"></line><line x1="10" y1="7" x2="10" y2="17"></line><line x1="14" y1="7" x2="14" y2="17"></line><line x1="18" y1="7" x2="18" y2="17"></line></svg>
            </div>
            <div class="card-title">Memory</div>
            <div class="card-value" id="ram-val">0<span style="font-size: 1.5rem; color: var(--text-muted)">%</span></div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="ram-bar"></div>
            </div>
        </div>

        <!-- Uptime Card -->
        <div class="card">
            <div class="card-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            <div class="card-title">System Uptime</div>
            <div class="card-value uptime-value" id="uptime-val">0h 0m 0s</div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();

        const cpuVal = document.getElementById('cpu-val');
        const cpuBar = document.getElementById('cpu-bar');
        
        const ramVal = document.getElementById('ram-val');
        const ramBar = document.getElementById('ram-bar');
        
        const uptimeVal = document.getElementById('uptime-val');

        socket.on('system_metrics', (data) => {
            // CPU Update
            cpuVal.innerHTML = `${data.cpu}<span style="font-size: 1.5rem; color: var(--text-muted)">%</span>`;
            cpuBar.style.width = `${data.cpu}%`;
            
            // Color changing based on load
            if(data.cpu > 80) cpuBar.style.background = 'linear-gradient(90deg, #ff4b2b, #ff416c)';
            else if(data.cpu > 50) cpuBar.style.background = 'linear-gradient(90deg, #f6d365, #fda085)';
            else cpuBar.style.background = 'linear-gradient(90deg, var(--accent-secondary), var(--accent-primary))';

            // RAM Update
            ramVal.innerHTML = `${data.ram}<span style="font-size: 1.5rem; color: var(--text-muted)">%</span>`;
            ramBar.style.width = `${data.ram}%`;

            if(data.ram > 80) ramBar.style.background = 'linear-gradient(90deg, #ff4b2b, #ff416c)';
            else if(data.ram > 50) ramBar.style.background = 'linear-gradient(90deg, #f6d365, #fda085)';
            else ramBar.style.background = 'linear-gradient(90deg, var(--accent-secondary), var(--accent-primary))';

            // Uptime Update
            uptimeVal.textContent = data.uptime;
        });
    </script>
</body>
</html>
